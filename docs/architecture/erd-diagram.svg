<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .entity-rect { fill: #ffffff; stroke: #3b82f6; stroke-width: 2.5px; rx: 8px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .entity-title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; text-anchor: middle; }
      .attr-ellipse { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5px; rx: 50px; ry: 20px; }
      .attr-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; text-anchor: middle; dominant-baseline: central; }
      .rel-diamond { fill: #eff6ff; stroke: #2563eb; stroke-width: 2px; }
      .rel-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }
      .conn-line { stroke: #64748b; stroke-width: 1.8px; stroke-dasharray: none; }
      .cardinality { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16"/>

  <!-- Diagram Header -->
  <text x="475" y="45" text-anchor="middle" class="title">StaffSync HRM - Entity Relationship Diagram (ERD)</text>
  <text x="475" y="68" text-anchor="middle" class="subtitle">Complete Data Model: Entities, Relationships, and Key Attributes</text>

  <!-- ================= EMPLOYEE ENTITY ================= -->
  <!-- Attributes for Employee -->
  <!-- EmployeeID -->
  <line x1="260" y1="210" x2="160" y2="135" class="conn-line"/>
  <ellipse cx="160" cy="135" class="attr-ellipse"/>
  <text x="160" y="135" class="attr-text">EmployeeID (PK)</text>

  <!-- FirstName -->
  <line x1="300" y1="210" x2="270" y2="125" class="conn-line"/>
  <ellipse cx="270" cy="125" class="attr-ellipse"/>
  <text x="270" y="125" class="attr-text">FirstName</text>

  <!-- LastName -->
  <line x1="340" y1="210" x2="380" y2="125" class="conn-line"/>
  <ellipse cx="380" cy="125" class="attr-ellipse"/>
  <text x="380" y="125" class="attr-text">LastName</text>

  <!-- Employee Box -->
  <rect x="230" y="210" width="160" height="60" class="entity-rect"/>
  <text x="310" y="246" class="entity-title">Employee</text>

  <!-- ================= MANAGER ENTITY ================= -->
  <!-- Attributes for Manager -->
  <!-- ManagerID -->
  <line x1="610" y1="210" x2="570" y2="125" class="conn-line"/>
  <ellipse cx="570" cy="125" class="attr-ellipse"/>
  <text x="570" y="125" class="attr-text">ManagerID (PK)</text>

  <!-- FirstName -->
  <line x1="670" y1="210" x2="680" y2="125" class="conn-line"/>
  <ellipse cx="680" cy="125" class="attr-ellipse"/>
  <text x="680" y="125" class="attr-text">FirstName</text>

  <!-- LastName -->
  <line x1="730" y1="210" x2="790" y2="135" class="conn-line"/>
  <ellipse cx="790" cy="135" class="attr-ellipse"/>
  <text x="790" y="135" class="attr-text">LastName</text>

  <!-- Manager Box -->
  <rect x="600" y="210" width="160" height="60" class="entity-rect"/>
  <text x="680" y="246" class="entity-title">Manager</text>

  <!-- Relationship: Employee - Manager Hierarchy/Supervision -->
  <line x1="390" y1="240" x2="600" y2="240" class="conn-line" stroke-dasharray="4,4"/>
  <text x="495" y="232" class="cardinality" text-anchor="middle">reports to / managed by</text>

  <!-- ================= RELATIONSHIP: SUBMITS (Employee -> LeaveRequest) ================= -->
  <line x1="310" y1="270" x2="310" y2="330" class="conn-line"/>
  <polygon points="310,330 365,360 310,390 255,360" class="rel-diamond"/>
  <text x="310" y="360" class="rel-text">submits</text>
  <line x1="310" y1="390" x2="310" y2="450" class="conn-line"/>
  <text x="320" y="300" class="cardinality">1</text>
  <text x="320" y="420" class="cardinality">N</text>

  <!-- ================= RELATIONSHIP: APPROVES (Manager -> LeaveRequest) ================= -->
  <line x1="680" y1="270" x2="480" y2="360" class="conn-line"/>
  <polygon points="480,330 535,360 480,390 425,360" class="rel-diamond"/>
  <text x="480" y="360" class="rel-text">approves</text>
  <line x1="425" y1="360" x2="390" y2="450" class="conn-line"/>
  <text x="590" y="305" class="cardinality">1</text>
  <text x="415" y="420" class="cardinality">N</text>

  <!-- ================= LEAVEREQUEST ENTITY ================= -->
  <rect x="230" y="450" width="160" height="60" class="entity-rect"/>
  <text x="310" y="486" class="entity-title">LeaveRequest</text>

  <!-- LeaveRequest Attributes -->
  <!-- StartDate -->
  <line x1="280" y1="510" x2="220" y2="585" class="conn-line"/>
  <ellipse cx="220" cy="585" class="attr-ellipse"/>
  <text x="220" y="585" class="attr-text">StartDate</text>

  <!-- EndDate -->
  <line x1="340" y1="510" x2="340" y2="585" class="conn-line"/>
  <ellipse cx="340" cy="585" class="attr-ellipse"/>
  <text x="340" y="585" class="attr-text">EndDate</text>

  <!-- Status -->
  <line x1="390" y1="500" x2="460" y2="585" class="conn-line"/>
  <ellipse cx="460" cy="585" class="attr-ellipse"/>
  <text x="460" y="585" class="attr-text">Status</text>

  <!-- ================= ATTENDANCE ENTITY ================= -->
  <!-- Relationship: Employee -> Attendance (records) -->
  <line x1="230" y1="240" x2="110" y2="240" class="conn-line"/>
  <line x1="110" y1="240" x2="110" y2="450" class="conn-line"/>
  <rect x="40" y="450" width="140" height="60" class="entity-rect"/>
  <text x="110" y="486" class="entity-title">Attendance</text>
  <text x="175" y="230" class="cardinality">1</text>
  <text x="120" y="430" class="cardinality">N</text>

  <!-- Attendance Attributes: Date -->
  <line x1="110" y1="510" x2="110" y2="585" class="conn-line"/>
  <ellipse cx="110" cy="585" class="attr-ellipse"/>
  <text x="110" y="585" class="attr-text">Date</text>

  <!-- ================= ANNOUNCEMENT ENTITY ================= -->
  <!-- Relationship: Manager -> Announcement (posts) -->
  <line x1="680" y1="270" x2="680" y2="340" class="conn-line"/>
  <polygon points="680,340 735,370 680,400 625,370" class="rel-diamond"/>
  <text x="680" y="370" class="rel-text">posts</text>
  <line x1="680" y1="400" x2="680" y2="450" class="conn-line"/>
  <text x="690" y="305" class="cardinality">1</text>
  <text x="690" y="430" class="cardinality">N</text>

  <!-- Announcement Box -->
  <rect x="600" y="450" width="160" height="60" class="entity-rect"/>
  <text x="680" y="486" class="entity-title">Announcement</text>

  <!-- Announcement Attribute -->
  <line x1="680" y1="510" x2="680" y2="585" class="conn-line"/>
  <ellipse cx="680" cy="585" class="attr-ellipse" rx="65" ry="20"/>
  <text x="680" y="585" class="attr-text">Announcement</text>

  <!-- Footer note -->
  <text x="475" y="650" text-anchor="middle" class="subtitle">Built with MERN Stack • Role-Based Access Control • MongoDB Schema Integration</text>
</svg>
